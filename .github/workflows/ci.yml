name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Non-blocking until the 99 pre-existing errors are cleared; see docs/RELEASE.md.
      - run: npm run lint
        continue-on-error: true

      - run: npm run typecheck

      - run: npm test -- --ci
